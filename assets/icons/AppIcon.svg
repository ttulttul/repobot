<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 768 768" fill="none" color-interpolation="sRGB">
  <title>Repobot app icon</title>
  <desc>Blue rounded square with a white branching arrow and six cyan repository lines. Vector reconstruction of the supplied design, without text.</desc>
  <defs>
    <linearGradient id="rim" x1="422" y1="96" x2="422" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#80deff"/>
      <stop offset=".25" stop-color="#22adff"/>
      <stop offset=".72" stop-color="#087bec"/>
      <stop offset="1" stop-color="#175bbc"/>
    </linearGradient>
    <linearGradient id="blue" x1="422" y1="103" x2="422" y2="693" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13b2f5"/>
      <stop offset=".22" stop-color="#008ff0"/>
      <stop offset=".48" stop-color="#006cbe"/>
      <stop offset=".73" stop-color="#00498f"/>
      <stop offset="1" stop-color="#002557"/>
    </linearGradient>
    <linearGradient id="faceEdge" x1="422" y1="103" x2="422" y2="693" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d2f5ff" stop-opacity=".8"/>
      <stop offset=".45" stop-color="#4bc5ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#001e59" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="topLight" cx=".5" cy="0" r=".78" gradientTransform="translate(0 .01) scale(1 .65)">
      <stop stop-color="#5ad6ff" stop-opacity=".29"/>
      <stop offset="1" stop-color="#13aaff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerShade" cx=".50" cy=".53" r=".55">
      <stop stop-color="#002b55" stop-opacity=".25"/>
      <stop offset="1" stop-color="#003169" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="white" x1="378" y1="247" x2="458" y2="596" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".42" stop-color="#f2f9ff"/>
      <stop offset="1" stop-color="#dcecf7"/>
    </linearGradient>
    <linearGradient id="leftLine" x1="178" y1="0" x2="355" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#59b5f2"/>
      <stop offset="1" stop-color="#12a7ec"/>
    </linearGradient>
    <linearGradient id="aquaLine" x1="544" y1="0" x2="668" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54d2df"/>
      <stop offset="1" stop-color="#00aef5"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="487" y1="432" x2="613" y2="461" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04c4f4"/>
      <stop offset="1" stop-color="#00a3ee"/>
    </linearGradient>
    <linearGradient id="lowLine" x1="487" y1="494" x2="659" y2="524" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c94ec"/>
      <stop offset="1" stop-color="#0378c9"/>
    </linearGradient>
    <linearGradient id="lineEdge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a0ecff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#58baff" stop-opacity=".2"/>
    </linearGradient>
    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12" result="offset"/>
      <feFlood flood-color="#005487" flood-opacity=".30"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glyphShadow" x="-25%" y="-20%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dx="1" dy="7" result="offset"/>
      <feFlood flood-color="#002b60" flood-opacity=".5"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="tile" d="M282 96H562C678 96 740 153 740 270V526C740 644 684 700 563 700H281C162 700 104 645 104 528V268C104 152 164 96 282 96Z"/>
    <path id="face" d="M282 103H562C676 103 733 157 733 271V525C733 640 679 693 562 693H282C167 693 111 640 111 527V269C111 157 168 103 282 103Z"/>
    <path id="branch" d="M274 246C264 246 256 253 259 266L273 326C275 338 287 345 296 335L310 314C367 358 402 399 403 460V580C403 590 410 596 422 596C434 596 441 590 441 580V460C442 399 478 358 535 314L548 333C556 345 570 339 573 327L586 265C589 254 581 246 568 246H503C489 246 484 259 494 269L511 284C468 319 440 345 422 376C404 345 376 319 335 284L352 270C364 260 357 246 343 246Z"/>
  </defs>
  <!-- The supplied artwork is gently normalized to a square tile. The canvas
       retains transparent padding for the rim and the soft exterior shadow. -->
  <g transform="translate(66 66) scale(1 1.05298013245) translate(-104 -96)">
    <use href="#tile" fill="url(#rim)" filter="url(#tileShadow)"/>
    <use href="#tile" stroke="#138ded" stroke-width=".8"/>
    <use href="#face" fill="url(#blue)"/>
    <use href="#face" fill="url(#topLight)"/>
    <use href="#face" fill="url(#centerShade)"/>
    <use href="#face" stroke="url(#faceEdge)" stroke-width="1.1"/>
    <g stroke="url(#lineEdge)" stroke-width="1.1">
      <rect x="178" y="381" width="133" height="30" rx="15" fill="url(#leftLine)"/>
      <rect x="178" y="440" width="177" height="31" rx="15.5" fill="url(#leftLine)" opacity=".92"/>
      <rect x="178" y="498" width="125" height="30" rx="15" fill="url(#leftLine)" opacity=".78"/>
      <rect x="544" y="379" width="124" height="30" rx="15" fill="url(#aquaLine)"/>
      <rect x="487" y="432" width="126" height="30" rx="15" fill="url(#cyanLine)"/>
      <rect x="487" y="494" width="172" height="30" rx="15" fill="url(#lowLine)" opacity=".93"/>
    </g>
    <use href="#branch" fill="#c6dce9" transform="translate(0 1.5)" filter="url(#glyphShadow)"/>
    <use href="#branch" fill="url(#white)" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M263 262C262 255 267 250 275 250H343M502 250H568C577 250 583 255 581 263" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
    <path d="M310 314C367 358 402 399 403 460M535 314C478 358 442 399 441 460" stroke="#c4dceb" stroke-width="1.5" opacity=".65"/>
  </g>
</svg>
