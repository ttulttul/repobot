name: Repobot
options:
  minimumXcodeGenVersion: 2.42.0
  fileTypes:
    icon:
      file: true
  deploymentTarget:
    macOS: '15.0'
packages:
  Repobot:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
targets:
  Repobot:
    type: application
    platform: macOS
    sources:
      - path: Sources/RepobotApp
        excludes: [Info.plist]
      - path: assets/icons/AppIcon.icon
        buildPhase: resources
      - path: assets/icons/MenuBarGlyph.svg
        buildPhase: resources
    dependencies:
      - package: Repobot
        product: RepobotCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/RepobotApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.repobot.app
        PRODUCT_NAME: Repobot
        EXECUTABLE_NAME: RepobotApp
        CODE_SIGN_ENTITLEMENTS: Repobot.entitlements
schemes:
  Repobot:
    build:
      targets:
        Repobot: all
